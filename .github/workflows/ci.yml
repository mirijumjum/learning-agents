# Same gate as .gitlab-ci.yml: the project's tests plus the offline release evaluation.
# Needs no secrets. Free on standard GitHub-hosted runners in public repositories;
# in private repositories it uses the plan's included Actions minutes.
name: CI

on:
  push:
    branches: ["main", "copilot/**", "ai/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Release evaluation (offline mock model)
        run: devassist eval --profile mock
