# Prepares the environment of Copilot cloud agent before it starts working
# (https://docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent/customize-the-agent-environment).
# Rules from the docs: one job called exactly `copilot-setup-steps`; only steps, permissions,
# runs-on, services, snapshot and timeout-minutes are honoured; timeout-minutes at most 59;
# the file must be on the default branch. Copilot code review reuses it by default.
#
# It also runs as an ordinary workflow when this file changes, so a broken setup shows up as a
# failed check. Needs no secrets.
name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the project and test tools
        run: pip install -e ".[dev]"
      # Warms caches and shows Copilot the starting state. A red suite here does not stop the
      # agent: Copilot starts from the current state, and its PR must still pass CI.
      - name: Run the test suite once
        run: python -m pytest -q
