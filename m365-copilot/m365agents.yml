# yaml-language-server: $schema=https://aka.ms/m365-agents-toolkits/v1.10/yaml.schema.json
# Microsoft 365 Agents Toolkit project for DevAssist as a declarative agent.
# "Provision" registers the Entra app that protects the actions API, the Entra SSO
# auth config the plugin uses, and the app in the Teams Developer Portal, then makes
# the agent available in Microsoft 365 Copilot. The actions API is deployed separately
# (see docs/ALTERNATIVA-m365-copilot.md); set DEVASSIST_ACTIONS_URL to its https URL.
version: v1.10

environmentFolderPath: ./env

provision:
  # Entra app registration that secures the actions API (scope DevAssist.Use).
  - uses: aadApp/create
    with:
      name: devassist-actions${{APP_NAME_SUFFIX}}
      generateClientSecret: true
      signInAudience: AzureADMyOrg
    writeToEnvironmentFile:
      clientId: AAD_APP_CLIENT_ID
      clientSecret: SECRET_AAD_APP_CLIENT_SECRET
      objectId: AAD_APP_OBJECT_ID
      tenantId: AAD_APP_TENANT_ID
      authority: AAD_APP_OAUTH_AUTHORITY
      authorityHost: AAD_APP_OAUTH_AUTHORITY_HOST

  # Teams app registration in the Developer Portal.
  - uses: teamsApp/create
    with:
      name: DevAssist${{APP_NAME_SUFFIX}}
    writeToEnvironmentFile:
      teamsAppId: TEAMS_APP_ID

  # Entra SSO auth config in the Microsoft Enterprise token store. The plugin
  # manifest references it as ENTRA_SSO_CONFIGURATION_ID; Copilot uses it to get a
  # delegated token for the signed-in user and sends it to the actions API.
  - uses: oauth/register
    with:
      name: entraAuthCode
      flow: authorizationCode
      identityProvider: MicrosoftEntra
      appId: ${{TEAMS_APP_ID}}
      clientId: ${{AAD_APP_CLIENT_ID}}
      clientSecret: ${{SECRET_AAD_APP_CLIENT_SECRET}}
      isPKCEEnabled: true
      applicableToApps: SpecificApp
      targetAudience: HomeTenant
      apiSpecPath: ./appPackage/apiSpecificationFile/devassist-actions.yml
    writeToEnvironmentFile:
      configurationId: ENTRA_SSO_CONFIGURATION_ID
      applicationIdUri: ENTRA_SSO_APPLICATION_ID_URI

  # Scope, redirect URI, pre-authorised token store client and the SSO Application ID URI (from the step above).
  - uses: aadApp/update
    with:
      manifestPath: ./aad.manifest.json
      outputFilePath: ./build/aad.manifest.${{TEAMSFX_ENV}}.json

  - uses: teamsApp/validateManifest
    with:
      manifestPath: ./appPackage/manifest.json

  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./appPackage/manifest.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build

  - uses: teamsApp/validateAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  - uses: teamsApp/update
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  # Makes the declarative agent available in Microsoft 365 Copilot (Teams, Outlook, Microsoft 365 app).
  - uses: teamsApp/extendToM365
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
    writeToEnvironmentFile:
      titleId: M365_TITLE_ID
      appId: M365_APP_ID

publish:
  - uses: teamsApp/validateManifest
    with:
      manifestPath: ./appPackage/manifest.json

  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./appPackage/manifest.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build

  - uses: teamsApp/validateAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  - uses: teamsApp/update
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  # Submits the app to the organisation's catalogue for the Microsoft 365 admin to approve.
  - uses: teamsApp/publishAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
    writeToEnvironmentFile:
      publishedAppId: TEAMS_APP_PUBLISHED_APP_ID
